<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Little Prince Launcher</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<!-- the sky: clouds drift behind everything -->
<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="cloud c4"></div><div class="sparkle s1"></div><div class="sparkle s2"></div>
  <div class="sparkle s3"></div>
</div>

<div class="app">
  <!-- left: the six games -->
  <aside class="side">
    <header class="brand">
      <img src="/ui/prince.png" alt="">
      <div>
        <b data-t="brand">星願小王子</b>
        <span data-t="brand_sub">遊戲啟動器</span>
      </div>
      <button class="lang" id="lang" title="Language">中 / EN</button>
    </header>
    <nav id="games" class="games" aria-label="Games"></nav>
  </aside>

  <!-- right: the chosen game -->
  <main class="stage">
    <section class="banner" id="banner">
      <div class="art">
        <div class="blur" id="blur"></div>
        <img id="hero" alt="">
        <div class="badge" id="state"></div>
      </div>
      <div class="info">
        <div class="caption">
          <h1 id="title"></h1>
          <p id="sub"></p>
        </div>
        <div class="go">
          <div class="progress hide" id="progress">
            <div class="bar"><i id="pbar"></i></div>
            <span id="ptext"></span>
          </div>
          <button class="play" id="play"><span data-t="play">開始遊戲</span></button>
        </div>
      </div>
    </section>
    <p class="note" id="note"></p>
  </main>
</div>

<!-- bottom: everything else -->
<footer class="dock">
  <div class="hills" aria-hidden="true"></div>
  <div class="buttons">
    <button data-open="accounts"><i class="ic ic-user"></i><span data-t="accounts">帳戶設定</span></button>
    <button data-open="mods"><i class="ic ic-star"></i><span data-t="mods">模組</span></button>
    <button id="settingsBtn"><i class="ic ic-gear"></i><span data-t="settings">設定</span></button>
    <button id="logBtn"><i class="ic ic-scroll"></i><span data-t="log">紀錄</span></button>
  </div>
  <button class="server" id="serverBtn"><i class="dot" id="dot"></i><span id="serverText"></span></button>
  <div class="marquee" id="marquee"></div>
</footer>

<!-- server details -->
<div class="pop hide" id="serverPop">
  <h3 data-t="server">本機伺服器</h3>
  <dl id="stats"></dl>
  <p class="small" id="footer"></p>
  <div class="row">
    <button data-server="start" data-t="start">啟動</button>
    <button data-server="stop" data-t="stop">停止</button>
    <button data-server="test" data-t="test">測試連線</button>
    <button data-server="revert" data-t="revert">還原 hosts</button>
  </div>
</div>

<!-- log -->
<div class="drawer hide" id="drawer">
  <div class="drawer-head">
    <b data-t="log">紀錄</b>
    <span class="grow"></span>
    <button data-open="log" data-t="open_log">打開紀錄檔</button>
    <button data-open="folder" data-t="open_folder">打開資料夾</button>
    <button class="x" id="drawerClose" aria-label="Close">×</button>
  </div>
  <pre id="log"></pre>
</div>

<!-- modal: settings / licence / questions from the launcher -->
<div class="veil hide" id="veil">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/ui/app.js"></script>
</body>
</html>
